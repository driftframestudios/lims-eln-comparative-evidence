name: verify-comparative-evidence

on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run comparison and admission tests
        run: python -m unittest discover -s tests -v
      - name: Generate portable comparison
        env:
          PYTHONPATH: src
        run: >-
          python -m comparative_evidence.cli compare
          --profile specification/comparison-profile.json
          --simulation fixtures/pairs/simulation-observation.json
          --actual fixtures/pairs/actual-observation.json
          --output build/comparison
      - name: Check generated artifact boundary
        run: python tools/check_artifacts.py build/comparison
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comparative-report-${{ matrix.python-version }}
          path: build/comparison/
          if-no-files-found: error
          retention-days: 7

  comparative-validation:
    if: ${{ always() }}
    needs: test-and-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete comparative proof matrix
        env:
          TEST_AND_REPORT_RESULT: ${{ needs.test-and-report.result }}
        run: test "$TEST_AND_REPORT_RESULT" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate released evidence, calibration posture, and repository safety
        run: python tools/validate_repository.py
