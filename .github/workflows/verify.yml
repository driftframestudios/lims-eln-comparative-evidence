name: verify-comparative-evidence

on:
  workflow_dispatch:
    inputs:
      confirm_run:
        description: Confirm a human has allocated this remote proof
        required: true
        default: false
        type: boolean
      retain_comparison:
        description: Retain the portable comparison for one day
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-report:
    if: ${{ vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install released schema validation support
        run: python -m pip install --disable-pip-version-check --editable ".[validation]"
      - name: Run comparison and admission tests
        run: python -m unittest discover -s tests -v
      - name: Generate portable synthetic contract exercise
        env:
          PYTHONPATH: src
        run: >-
          python -m comparative_evidence.cli compare-synthetic-contract
          --profile specification/comparison-profile.json
          --simulation fixtures/pairs/simulation-observation.json
          --contract-candidate fixtures/contracts/planned-observation.json
          --output build/comparison
      - name: Check generated artifact boundary
        run: python tools/check_artifacts.py build/comparison
      - name: Retain portable comparison for one day
        if: ${{ always() && inputs.retain_comparison }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparative-report-${{ matrix.python-version }}
          path: build/comparison/
          if-no-files-found: error
          retention-days: 1

  comparative-validation:
    if: ${{ always() && vars.ENABLE_GITHUB_ACTIONS == 'true' && inputs.confirm_run }}
    needs: test-and-report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete comparative proof matrix
        env:
          TEST_AND_REPORT_RESULT: ${{ needs.test-and-report.result }}
        run: test "$TEST_AND_REPORT_RESULT" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install released schema validation support
        run: python -m pip install --disable-pip-version-check --editable ".[validation]"
      - name: Validate released evidence, calibration posture, and repository safety
        run: python tools/validate_repository.py
