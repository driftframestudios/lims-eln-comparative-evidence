name: verify-comparative-evidence

on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run comparison and admission tests
        run: python -m unittest discover -s tests -v
      - name: Generate portable comparison
        env:
          PYTHONPATH: src
        run: >-
          python -m comparative_evidence.cli compare
          --profile specification/comparison-profile.json
          --simulation fixtures/pairs/simulation-observation.json
          --actual fixtures/pairs/actual-observation.json
          --output build/comparison
      - name: Check generated artifact boundary
        run: python tools/check_artifacts.py build/comparison
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comparative-report-${{ matrix.python-version }}
          path: build/comparison/
          if-no-files-found: error
          retention-days: 7
