[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-eln-comparative-evidence"
version = "0.1.0"
description = "Independent three-way comparator and observed-evidence admission gate"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lims-eln-compare = "comparative_evidence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

