[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-eln-comparative-evidence"
version = "0.4.0"
description = "Independent factual comparator for caller-supplied LIMS and ELN evidence records"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
lims-eln-compare = "comparative_evidence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comparative_evidence = ["schemas/*.json"]
