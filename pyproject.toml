[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-eln-comparative-evidence"
version = "0.3.2"
description = "Independent comparator for caller-supplied observed evidence, planned contract shapes, and selected-future simulations"
authors = [{ name = "Driftframe Studios, Limited Liability Company" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema==4.26.0"]
administrative-study = [
  "lims-eln-program-specification @ git+https://github.com/driftframestudios/lims-eln-program-specification.git@83a97deb76b9a5636cc7da484d350d5556c51661",
  "lims-eln-simulated-final-state @ git+https://github.com/driftframestudios/lims-eln-simulated-final-state.git@8c31ab403207c1797da0cb55b5aaee0cf690aa75",
]
contract-conformance = [
  "lims-eln-program-specification @ git+https://github.com/driftframestudios/lims-eln-program-specification.git@4d06eeb7f96910311fbcb7f51547c978b6a07290",
]

[project.scripts]
lims-eln-compare = "comparative_evidence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comparative_evidence = ["contract_resources/*.json"]
