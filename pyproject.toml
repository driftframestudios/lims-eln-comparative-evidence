[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-eln-comparative-evidence"
version = "0.3.1"
description = "Independent comparator for observed and selected-future simulated evidence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema==4.26.0"]

[project.scripts]
lims-eln-compare = "comparative_evidence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
